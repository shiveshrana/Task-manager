# SonarQube / SonarCloud project configuration for TaskFlow
# Run with: sonar-scanner -Dproject.settings=sonar-project.properties
# (see README.md for full setup and analysis commands)

sonar.projectKey=taskflow
sonar.projectName=TaskFlow
sonar.projectVersion=1.0.0

# Source directories: both the React frontend and FastAPI backend
sonar.sources=frontend/src,backend/app
sonar.tests=frontend/src/tests,backend/tests

# Language-specific source encoding
sonar.sourceEncoding=UTF-8

# Test coverage reports
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions — build artifacts, dependencies, and generated files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/coverage/**,**/*.min.js,**/migrations/**

sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

sonar.coverage.exclusions=**/tests/**,**/*.test.jsx,**/*.test.js,**/main.jsx,**/main.py,**/conftest.py
